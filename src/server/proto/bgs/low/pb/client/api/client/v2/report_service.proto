syntax = "proto2";

import "bgs/low/pb/client/account_types.proto";
import "bgs/low/pb/client/api/client/v2/report_types.proto";
import "bgs/low/pb/client/rpc_types.proto";

package bgs.protocol.report.v2;

option cc_generic_services = false;

message SubmitReportRequest {
  option (bgs.protocol.message_options).custom_select_shard = true;
  optional .bgs.protocol.account.v1.AccountId agent_id = 1;
  optional string user_description = 2;
  oneof type {
    .bgs.protocol.report.v2.UserOptions user_options = 10;
    .bgs.protocol.report.v2.ClubOptions club_options = 11;
    .bgs.protocol.report.v2.EntityOptions entity_options = 20;
  }
}

service ReportService {
  option (bgs.protocol.service_options).descriptor_name = "bnet.protocol.report.v2.ReportService";
  option (bgs.protocol.service_options).shard_name = "report";
  option (bgs.protocol.service_options).is_global = true;
  option (bgs.protocol.sdk_service_options).outbound = true;
  rpc SubmitReport(.bgs.protocol.report.v2.SubmitReportRequest) returns (.bgs.protocol.NoData) {
    option (bgs.protocol.method_options).id = 1;
    option (bgs.protocol.method_options).custom_region_resolver = "ResolveSubmitReportRegion";
  }
}
